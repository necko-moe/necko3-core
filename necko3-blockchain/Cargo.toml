[package]
name = "necko3-blockchain"
description = "Chain interaction (`BlockchainAdapter`, `BlockchainWorker`). Currently powers the `EvmBlockchain` with block tracking, reorg protection, log filtering, and RPC rotation."
version.workspace = true
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

coins-bip32 = "0.13"
alloy = { version = "2.1.0", features = ["full", "reqwest-rustls-tls", "rpc", "json-rpc"] }

tower = "0.5"
reqwest = "0.13.4"

async-trait = "0.1"
url = "2.5"

necko3-types.workspace = true