[package]
name = "necko3-core"
version = "0.1.3"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

anyhow = "1"

reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

alloy-primitives = { version = "1.6", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
dashmap = "6.2"

necko3-types = { path = "../necko3-types" }
necko3-blockchain = { path = "../necko3-blockchain" }
necko3-database = { path = "../necko3-database" }
